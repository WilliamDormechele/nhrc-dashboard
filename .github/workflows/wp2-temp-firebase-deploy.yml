name: Temporary Firebase Hosting deploy

on:
  push:
    branches:
      - "deploy/wp2-device-empty-state-20261022"
    paths:
      - ".github/workflows/wp2-temp-firebase-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deploy revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Prepare Firebase service account
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.PHYSIO_HEMAB_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_JSON" || { echo "Missing Firebase service account secret"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Build versioned site
        run: npm run build:version

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project nhrc-dashboard --non-interactive

      - name: Remove temporary credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
