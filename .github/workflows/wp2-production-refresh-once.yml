name: WP2 production snapshot refresh

on:
  push:
    branches:
      - "deploy/wp2-device-nonrepeat-refresh-20261022"
    paths:
      - ".github/workflows/wp2-production-refresh-once.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: physio_hemab_wp2
          POSTGRES_USER: physio_hemab
          POSTGRES_PASSWORD: physio_refresh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U physio_hemab -d physio_hemab_wp2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install WP2 dependencies
        working-directory: integrations/physio-hemab-wp2
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Prepare Firebase credential
        env:
          FIREBASE_JSON: ${{ secrets.PHYSIO_HEMAB_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_JSON" || { echo "Missing Firebase service account"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_JSON" > "$RUNNER_TEMP/wp2-firebase.json"

      - name: Build reporting database
        env:
          PGPASSWORD: physio_refresh
        run: |
          psql -h 127.0.0.1 -U physio_hemab -d physio_hemab_wp2 -v ON_ERROR_STOP=1             -f integrations/physio-hemab-wp2/sql/schema.sql
          psql -h 127.0.0.1 -U physio_hemab -d physio_hemab_wp2 -v ON_ERROR_STOP=1             -f integrations/physio-hemab-wp2/sql/views.sql

      - name: Synchronize live REDCap and publish production snapshot
        working-directory: integrations/physio-hemab-wp2
        env:
          PHYSIO_HEMAB_MAIN_REDCAP_API_URL: ${{ secrets.PHYSIO_HEMAB_MAIN_REDCAP_API_URL }}
          PHYSIO_HEMAB_MAIN_REDCAP_API_TOKEN: ${{ secrets.PHYSIO_HEMAB_MAIN_REDCAP_API_TOKEN }}
          PHYSIO_HEMAB_MAIN_REDCAP_RECORD_ID_FIELD: ${{ secrets.PHYSIO_HEMAB_MAIN_REDCAP_RECORD_ID_FIELD || 'record_id' }}
          PHYSIO_HEMAB_DEVICES_REDCAP_API_URL: ${{ secrets.PHYSIO_HEMAB_DEVICES_REDCAP_API_URL }}
          PHYSIO_HEMAB_DEVICES_REDCAP_API_TOKEN: ${{ secrets.PHYSIO_HEMAB_DEVICES_REDCAP_API_TOKEN }}
          PHYSIO_HEMAB_DEVICES_REDCAP_RECORD_ID_FIELD: ${{ secrets.PHYSIO_HEMAB_DEVICES_REDCAP_RECORD_ID_FIELD || 'record_id' }}
          PHYSIO_HEMAB_DB_HOST: 127.0.0.1
          PHYSIO_HEMAB_DB_PORT: "5432"
          PHYSIO_HEMAB_DB_NAME: physio_hemab_wp2
          PHYSIO_HEMAB_DB_USER: physio_hemab
          PHYSIO_HEMAB_DB_PASSWORD: physio_refresh
          PHYSIO_HEMAB_DB_SSLMODE: disable
          PHYSIO_HEMAB_FIREBASE_CREDENTIALS_FILE: ${{ runner.temp }}/wp2-firebase.json
          PHYSIO_HEMAB_FIREBASE_PROJECT_ID: nhrc-dashboard
          PHYSIO_HEMAB_REFRESH_SOURCE: assistant-device-fix-20261022
          PYTHONIOENCODING: utf-8
        run: |
          python src/sync.py all
          python src/check_reporting.py
          python src/publish_firestore.py

      - name: Remove temporary Firebase credential
        if: always()
        run: rm -f "$RUNNER_TEMP/wp2-firebase.json"
