name: Firebase Hosting REST permission test

on:
  push:
    branches:
      - "deploy/wp2-rest-hosting-test-20261022"
    paths:
      - ".github/workflows/wp2-hosting-rest-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Firebase Hosting REST access
        env:
          FIREBASE_JSON: ${{ secrets.PHYSIO_HEMAB_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install google-auth requests
          python - <<'PY'
          import json, os, tempfile, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw=os.environ.get("FIREBASE_JSON","")
          if not raw:
              raise SystemExit("Missing PHYSIO_HEMAB_FIREBASE_SERVICE_ACCOUNT_JSON")
          info=json.loads(raw)
          creds=service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          creds.refresh(Request())
          headers={"Authorization":f"Bearer {creds.token}"}
          url="https://firebasehosting.googleapis.com/v1beta1/sites/nhrc-dashboard"
          r=requests.get(url,headers=headers,timeout=30)
          print("status=",r.status_code)
          print(r.text[:2000])
          if r.status_code != 200:
              raise SystemExit(1)
          PY
